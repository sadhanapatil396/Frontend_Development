<!DOCTYPE html>
<html>
<head>
<title>JC & AI Grid</title>
</head>

<body>
<main style="width:90%; margin:auto;">

<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:5px;">

  <div style="border:1px solid black;"><h2>J-C: start<br>A-I: start</h2></div>
  <div style="border:1px solid black;"><h2>J-C: center<br>A-I: start</h2></div>
  <div style="border:1px solid black;"><h2>J-C: end<br>A-I: end</h2></div>

  <div style="border:1px solid black;"><h2>J-C: start<br>A-I: center</h2></div>
  <div style="border:1px solid black;"><h2>J-C: center<br>A-I: center</h2></div>
  <div style="border:1px solid black;"><h2>J-C: end<br>A-I: center</h2></div>

  <div style="border:1px solid black;"><h2>J-C: start<br>A-I: end</h2></div>
  <div style="border:1px solid black;"><h2>J-C: center<br>A-I: end</h2></div>
  <div style="border:1px solid black;"><h2>J-C: end<br>A-I: end</h2></div>

</div>

</main>
</body>
</html>
