<!DOCTYPE html>
<html>
<head>
    <title>Student Education Table</title>
</head>
<body style="font-family: Arial; background:#f2f2f2;">

<main style="width:90%; margin:auto; margin-top:20px;">

    <!-- Header Row -->
    <div style="display:flex; border:2px solid #000;">
        <div style="width:10%; border-right:2px solid #000; text-align:center;"><h2>Name</h2></div>
        <div style="width:50%; border-right:2px solid #000; text-align:center;"><h2>Education</h2></div>
        <div style="width:20%; border-right:2px solid #000; text-align:center;"><h2>Passed Out Year</h2></div>
        <div style="width:20%; text-align:center;"><h2>Remarks</h2></div>
    </div>

    <!-- Sub Header -->
    <div style="display:flex; border-left:2px solid #000; border-right:2px solid #000; border-bottom:2px solid #000;">
        <div style="width:10%; border-right:2px solid #000;"></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>10th</h2></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>PUC</h2></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>BCA</h2></div>
        <div style="width:20%; border-right:2px solid #000;"></div>
        <div style="width:20%;"></div>
    </div>

    <!-- Anvesh Row -->
    <div style="display:flex; border:2px solid #000; border-top:none;">
        <div style="width:10%; border-right:2px solid #000; text-align:center;"><h2>Anvesh</h2></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>St. Mary School</h2></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>ABC College</h2></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>XYZ University</h2></div>
        <div style="width:20%; border-right:2px solid #000; text-align:center;"><h2>2022</h2></div>
        <div style="width:20%; text-align:center;"><h2>Good Student</h2></div>
    </div>

    <!-- Anvesh Extra -->
    <div style="display:flex; border:2px solid #000; border-top:none;">
        <div style="width:10%; border-right:2px solid #000;"></div>
        <div style="width:70%; border-right:2px solid #000; text-align:center;">
            <h2>Participated in Science Fair</h2>
        </div>
        <div style="width:20%;"></div>
    </div>

    <!-- Vasu Row -->
    <div style="display:flex; border:2px solid #000; border-top:none;">
        <div style="width:10%; border-right:2px solid #000; text-align:center;"><h2>Vasu</h2></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>Little Flower School</h2></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>Govt PU College</h2></div>
        <div style="width:16.6%; border-right:2px solid #000; text-align:center;"><h2>National BCA College</h2></div>
        <div style="width:20%; border-right:2px solid #000; text-align:center;"><h2>2023</h2></div>
        <div style="width:20%; text-align:center;"><h2>Excellent Performance</h2></div>
    </div>

    <!-- Vasu Extra -->
    <div style="display:flex; border:2px solid #000; border-top:none;">
        <div style="width:10%; border-right:2px solid #000;"></div>
        <div style="width:70%; border-right:2px solid #000; text-align:center;">
            <h2>Topper in PUC</h2>
        </div>
        <div style="width:20%;"></div>
    </div>

    <div style="display:flex; border:2px solid #000; border-top:none;">
        <div style="width:10%; border-right:2px solid #000;"></div>
        <div style="width:70%; border-right:2px solid #000; text-align:center;">
            <h2>Sports Captain</h2>
        </div>
        <div style="width:20%;"></div>
    </div>

</main>

</body>
</html>
