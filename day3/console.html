<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: white;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      padding: 0 10%;
    }

    .text-section {
      max-width: 500px;
    }

    .text-section h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .text-section h1 span {
      color: #3b82f6;
    }

    .text-section p {
      font-size: 18px;
      margin-bottom: 20px;
      color: #cbd5f5;
    }

    .btn {
      padding: 10px 20px;
      background-color: #3b82f6;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    .image-section img {
      width: 300px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 20px 10%;
      background-color: #0f172a;
    }

    nav h2 {
      color: white;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    nav ul li {
      cursor: pointer;
      color: #cbd5f5;
    }

    nav ul li:hover {
      color: white;
    }

  </style>
</head>
<body>

  <nav>
    <h2>J.</h2>
    <ul>
      <li>Home</li>
      <li>About Me</li>
      <li>Projects</li>
      <li>Contact</li>
    </ul>
  </nav>

  <div class="container">
    
    <div class="text-section">
      <h1>Hey, I am <span>Jenny</span></h1>
      <p>I am a Frontend Developer & Mentor</p>
      <button class="btn">Contact Me</button>
    </div>

    <div class="image-section">
      <img src="https://img.freepik.com/premium-vector/young-man-sitting-front-computer_10045-195.jpg" alt="developer">
    </div>

  </div>

</body>
</html>
